name: Desktop Windows
on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths: ['crates/**', 'xtask/**', 'resources/**', 'packages/desktop/**', 'packages/contracts/**', 'packages/wizard/**', 'src/**', 'Cargo.*', 'rust-toolchain.toml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'build-desktop.ps1', '.gitattributes', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['crates/**', 'xtask/**', 'resources/**', 'packages/desktop/**', 'packages/contracts/**', 'packages/wizard/**', 'src/**', 'Cargo.*', 'rust-toolchain.toml', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'build-desktop.ps1', '.gitattributes', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit, browser and portable startup tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: desktop-x86_64-pc-windows-msvc-tests-${{ inputs.run_tests || false }}
          cache-bin: false
      - name: Build portable application
        shell: pwsh
        env:
          RUN_TESTS: ${{ inputs.run_tests || false }}
        run: ./build-desktop.ps1 -RunTests:($env:RUN_TESTS -eq 'true')
      - uses: actions/upload-artifact@v7
        with:
          name: ffxiv-packet-desktop-windows-x64
          path: packages/desktop/ffxiv-packet-desktop-windows-x64.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ffxiv-packet-desktop-windows-x64
          path: release
      - name: Publish portable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum ffxiv-packet-desktop-windows-x64.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" \
            ffxiv-packet-desktop-windows-x64.zip SHA256SUMS \
            --verify-tag --title "Desktop ${RELEASE_TAG#desktop-}" \
            --notes-file ../docs/desktop-release.md
